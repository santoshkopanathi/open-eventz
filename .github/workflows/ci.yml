name: CI

on: [push, pull_request]

jobs:
  unit:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Type-check
        id: typecheck
        run: npm run typecheck
      - name: Unit tests (with coverage)
        id: unit
        run: npm test -- --coverage --coverageReporters=text-summary --coverageReporters=lcov --coverageReporters=html
      # Second pass in the OPPOSITE timezone. The "5:00 AM story time" bug was invisible on a
      # Central dev machine and only appeared on UTC runners; a suite that runs in one timezone
      # can't catch a time bug that depends on the timezone. Central is pinned here because the
      # runner is already UTC, so this pair covers both sides.
      - name: Unit tests (America/Chicago — timezone-independence check)
        id: unit_tz
        run: npm test
        env:
          TZ: America/Chicago
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 30
          if-no-files-found: ignore
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Type-check & unit tests"
            echo "- Type-check: ${{ steps.typecheck.outcome }}"
            echo "- Unit tests (Jest, runner TZ=UTC): ${{ steps.unit.outcome }}"
            echo "- Unit tests (TZ=America/Chicago): ${{ steps.unit_tz.outcome }}"
            echo "- Coverage report uploaded as the \`coverage\` artifact (HTML + lcov)."
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # /api/* is mocked in the tests, so no Supabase secrets are needed. The dev server boots
      # with the dummy env from playwright.config.ts.
      - name: E2E smoke
        id: e2e
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 30
          if-no-files-found: ignore
      - name: Job summary
        if: always()
        run: |
          {
            echo "### E2E smoke (Playwright)"
            echo "- Result: ${{ steps.e2e.outcome }}"
            echo "- HTML report uploaded as the \`playwright-report\` artifact."
          } >> "$GITHUB_STEP_SUMMARY"

  doc-parity:
    name: Doc↔test parity
    runs-on: ubuntu-latest
    # Independent of unit/e2e — fails only if TEST-SCENARIOS.md names a test file that
    # no longer exists, so the PM test plan can't silently drift from the real suite.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Doc↔test parity
        id: parity
        run: node scripts/check-doc-parity.mjs
      - name: Job summary
        if: always()
        run: |
          {
            echo "### Doc↔test parity"
            echo "- Result: ${{ steps.parity.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
