name: CI

on: [push, pull_request]

jobs:
  unit:
    name: Type-check & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: E2E smoke (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # /api/* is mocked in the tests, so no Supabase secrets are needed. The dev server boots
      # with the dummy env from playwright.config.ts.
      - run: npm run test:e2e
